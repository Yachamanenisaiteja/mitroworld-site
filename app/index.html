  b.querySelector('.on').onclick = async () => { const r = await enablePush(true); b.remove(); toast(r === 'granted' ? '🔔 Notifications are on' : r === 'denied' ? 'Notifications are blocked — allow them in your phone settings' : 'Notifications not available on this device'); };
  b.querySelector('.x').onclick = () => { store.set('mitro-nb-x', '1'); b.remove(); };
  page.prepend(b);
}
function notifSettings() {
  const st = !pushOk() ? 'Not supported on this browser. On iPhone, add MITRO to your Home Screen first (Share → Add to Home Screen).' : Notification.permission === 'granted' ? '✅ On for this device' : Notification.permission === 'denied' ? '⛔ Blocked — allow notifications for MITRO in your phone settings' : 'Off';
  const md = modal(`<h3>🔔 Notifications</h3><p>Messages, calls and reminders arrive as notifications — even when MITRO is closed.</p><p class="small">Status: <b>${st}</b></p>
    ${pushOk() && Notification.permission !== 'denied' ? '<button class="btn" id="pon">Turn on / refresh notifications</button>' : ''}<button class="ghost" id="ptest">Send me a test reminder</button>
    <p class="small">Mute any chat from its ⋮ menu.</p>`);
  md.querySelector('#pon')?.addEventListener('click', async () => { const r = await enablePush(true); md.remove(); toast(r === 'granted' ? '🔔 Notifications are on' : 'Could not turn on notifications (' + r + ')'); });
  md.querySelector('#ptest').onclick = async () => {
    const { error } = await sb.from('reminders').insert({ user_id: S.me.id, note: 'This is your test reminder from MITRO 👋', due_at: new Date(Date.now() + 60e3).toISOString() });
    md.remove(); toast(error ? friendly(error.message) : '⏰ Test reminder in about 1 minute');
  };
}

// ---------- Reminders ----------
function remindMenu(m) {
  const who = m.sender_id === S.me.id ? 'You' : (S.people.get?.(m.sender_id) ? nm(S.people.get(m.sender_id)) : S.cur?.name || '');
  const text = m.kind === 'text' ? bodyOf(m) : m.kind === 'image' ? '📷 Photo' : m.kind === 'voice' ? '🎤 Voice message' : (m.file_name || 'File');
  const at = (h, min = 0, addDay = 0) => { const d = new Date(); d.setDate(d.getDate() + addDay); d.setHours(h, min, 0, 0); return d; };
  const tonight = at(20) > new Date() ? at(20) : at(20, 0, 1);
  const opts = [['In 20 minutes', new Date(Date.now() + 20 * 60e3)], ['In 1 hour', new Date(Date.now() + 3600e3)], ['In 3 hours', new Date(Date.now() + 3 * 3600e3)], ['Tonight 8 PM', tonight], ['Tomorrow 9 AM', at(9, 0, 1)]];
  const md = modal(`<h3>⏰ Remind me</h3><p class="small">${esc((who ? who + ': ' : '') + String(text || '').slice(0, 120))}</p>
    ${opts.map((o, i) => `<button class="act" data-i="${i}">${o[0]} <span class="small">· ${o[1].toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</span></button>`).join('')}
    <label class="small" style="display:block;margin-top:10px">Pick a date &amp; time</label><input class="in" type="datetime-local" id="rd"><button class="btn" id="rs">Set reminder</button>`);
  const save = async (d) => {
    if (!(d > new Date())) return toast('Pick a time in the future');
    const note = ((who ? who + ': ' : '') + String(text || 'Message')).slice(0, 480) + (S.cur?.name ? ' — in ' + S.cur.name : '');
    const { error } = await sb.from('reminders').insert({ user_id: S.me.id, conversation_id: S.cur?.id || null, message_id: m.id > 0 ? m.id : null, note: note.slice(0, 500), due_at: d.toISOString() });
    md.remove(); if (error) return toast(friendly(error.message));
    toast('⏰ Reminder set for ' + d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }));
    if (pushOk() && Notification.permission === 'default') enablePush(true);
  };
  md.querySelectorAll('[data-i]').forEach((b) => (b.onclick = () => save(opts[+b.dataset.i][1])));
  md.querySelector('#rs').onclick = () => { const v = md.querySelector('#rd').value; if (!v) return toast('Pick a date and time'); save(new Date(v)); };
}

// ---------- Voice & video calls (WebRTC, 1:1) ----------
const CALL = { pc: null, id: null, role: null, local: null, kind: null, conv: null, ui: null, t0: 0, tick: null, ring: null, noAns: null, incoming: null, connected: false };
const isDM = (c) => c && !c.is_group && c.kind !== 'saved' && c.kind !== 'channel';
function gatherDone(pc) {
  return new Promise((res) => {
    if (pc.iceGatheringState === 'complete') return res();
    const done = () => { if (pc.iceGatheringState === 'complete') res(); };
    pc.addEventListener('icegatheringstatechange', done); setTimeout(res, 2500);
  });
}
function tone(kind) {
  stopTone();
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(); const g = ac.createGain(); g.gain.value = 0; g.connect(ac.destination);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(); o1.frequency.value = kind === 'ring' ? 440 : 425; o2.frequency.value = kind === 'ring' ? 480 : 425;
    o1.connect(g); o2.connect(g); o1.start(); o2.start();
    const beat = () => { const t = ac.currentTime; g.gain.setValueAtTime(kind === 'ring' ? 0.18 : 0.07, t); g.gain.setValueAtTime(0, t + (kind === 'ring' ? 1.2 : 1.0)); if (kind === 'ring') navigator.vibrate?.([600, 300, 600]); };
    beat(); const iv = setInterval(beat, kind === 'ring' ? 3000 : 4000);
    CALL.ring = () => { clearInterval(iv); try { o1.stop(); o2.stop(); ac.close(); } catch {} navigator.vibrate?.(0); };
  } catch { CALL.ring = null; }
}
function stopTone() { if (CALL.ring) { CALL.ring(); CALL.ring = null; } }
const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function callStatus(t) { const el = CALL.ui?.querySelector('#cst'); if (el) el.textContent = t; }

function callUI(peer, kind, status) {
  CALL.ui?.remove();
  const ui = $(`<div class="callv ${kind}"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
    <div class="ctop">${av(peer.name, peer.avatar, 96)}<b>${esc(peer.name)}</b><span id="cst">${esc(status)}</span><small>🔒 Private ${kind} call</small></div>
    <div class="cbar"><button id="cmu" title="Mute">🎤</button>${kind === 'video' ? '<button id="ccam" title="Camera">📷</button><button id="cflip" title="Switch camera">🔄</button>' : '<button id="cspk" title="Speaker">🔊</button>'}<button id="cend" class="end" title="End call">📞</button></div></div>`);
  document.body.appendChild(ui); CALL.ui = ui;
  if (CALL.local) ui.querySelector('#lv').srcObject = CALL.local;
  ui.querySelector('#cend').onclick = () => hangup();
  ui.querySelector('#cmu').onclick = (e) => { const a = CALL.local?.getAudioTracks()[0]; if (!a) return; a.enabled = !a.enabled; e.currentTarget.classList.toggle('off', !a.enabled); e.currentTarget.textContent = a.enabled ? '🎤' : '🔇'; };
  ui.querySelector('#ccam')?.addEventListener('click', (e) => { const v = CALL.local?.getVideoTracks()[0]; if (!v) return; v.enabled = !v.enabled; e.currentTarget.classList.toggle('off', !v.enabled); });
  ui.querySelector('#cflip')?.addEventListener('click', flipCam);
  ui.querySelector('#cspk')?.addEventListener('click', (e) => { const v = ui.querySelector('#rv'); v.muted = !v.muted; e.currentTarget.classList.toggle('off', v.muted); });
  return ui;
}
async function flipCam() {
  try {
    const cur = CALL.local.getVideoTracks()[0]; const face = cur.getSettings().facingMode === 'environment' ? 'user' : 'environment';
    const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face } }); const nt = ns.getVideoTracks()[0];
    const sender = CALL.pc.getSenders().find((s) => s.track?.kind === 'video'); await sender?.replaceTrack(nt);
    CALL.local.removeTrack(cur); cur.stop(); CALL.local.addTrack(nt); CALL.ui.querySelector('#lv').srcObject = CALL.local;
  } catch { toast('Could not switch camera'); }
}
function newPC() {
  const pc = new RTCPeerConnection(ICE);
  pc.ontrack = (e) => { const v = CALL.ui?.querySelector('#rv'); if (v && v.srcObject !== e.streams[0]) { v.srcObject = e.streams[0]; v.play?.().catch(() => {}); } };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected' && !CALL.connected) {
      CALL.connected = true; stopTone(); clearTimeout(CALL.noAns); CALL.ui?.classList.add('live'); CALL.t0 = Date.now();
      CALL.tick = setInterval(() => callStatus(fmt(Math.round((Date.now() - CALL.t0) / 1000))), 1000);
    }
    if (pc.connectionState === 'failed') { toast('Call connection lost'); hangup(); }
  };
  return pc;
}
async function getMedia(kind) {
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: kind === 'video' ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false });
}
async function startCall(kind) {
  const c = S.cur; if (!isDM(c)) return toast('Calls work in one-to-one chats');
  if (CALL.pc || CALL.incoming) return toast('You are already in a call');
  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) return toast('Calls are not supported on this browser');
  try { CALL.local = await getMedia(kind); } catch { return toast(`Allow microphone${kind === 'video' ? ' and camera' : ''} access to call`); }
  CALL.kind = kind; CALL.conv = c.id; CALL.role = 'caller'; CALL.connected = false;
  callUI({ name: c.name, avatar: c.avatar }, kind, 'Calling…'); tone('back');
  const pc = (CALL.pc = newPC()); CALL.local.getTracks().forEach((t) => pc.addTrack(t, CALL.local));
  await pc.setLocalDescription(await pc.createOffer()); await gatherDone(pc);
  if (!CALL.pc) return;
  const { data: id, error } = await sb.rpc('start_call', { conv: c.id, call_kind: kind, sdp: pc.localDescription.toJSON() });
  if (error) { cleanupCall(); return toast(callErr(error.message)); }
  CALL.id = id; callStatus('Ringing…');
  const { data: row } = await sb.from('rtc_calls').select('status,answer').eq('id', id).single();
  if (row?.status === 'busy') { toast(c.name + ' is on another call'); return cleanupCall(); }
  if (row?.status === 'accepted' && row.answer) onCallRow({ ...row, id, caller_id: S.me.id });
  CALL.noAns = setTimeout(() => { if (CALL.id === id && !CALL.connected) { sb.rpc('end_call', { cid: id, how: 'missed' }); toast('No answer'); cleanupCall(); } }, 45000);
}
async function onCallRow(r) {
  if (!r?.id) return;
  if (r.callee_id === S.me.id && r.status === 'ringing' && !CALL.pc && !CALL.incoming && Date.now() - Date.parse(r.created_at) < 55000) return incomingCall(r);
  if (CALL.incoming?.id === r.id && r.status !== 'ringing') { closeIncoming(); if (r.status === 'missed') toast('Missed call'); return; }
  if (r.id !== CALL.id) return;
  if (CALL.role === 'caller' && r.status === 'accepted' && r.answer && !CALL.pc?.remoteDescription) {
    callStatus('Connecting…'); try { await CALL.pc.setRemoteDescription(r.answer); } catch (e) { console.warn(e); }
  }
  if (['declined', 'ended', 'missed', 'busy'].includes(r.status)) { if (CALL.pc) toast(r.status === 'declined' ? 'Call declined' : 'Call ended'); cleanupCall(); }
}
async function incomingCall(r) {
  CALL.incoming = r;
  const { data: p } = await sb.from('profiles').select('display_name,username,avatar_url').eq('id', r.caller_id).single();
  if (CALL.incoming?.id !== r.id) return;
  const peer = { name: nm(p), avatar: p?.avatar_url };
  const ov = $(`<div class="callin"><div class="ctop">${av(peer.name, peer.avatar, 104)}<b>${esc(peer.name)}</b><span>${r.kind === 'video' ? '📹 Incoming video call' : '📞 Incoming voice call'}</span><small>MITRO</small></div>
    <div class="cbar"><button class="end" id="dec" title="Decline">📞</button><button class="acc" id="acc" title="Answer">${r.kind === 'video' ? '📹' : '📞'}</button></div></div>`);
  document.body.appendChild(ov); CALL.inUI = ov; tone('ring');
  if (document.hidden && Notification?.permission === 'granted') navigator.serviceWorker?.ready.then((reg) => reg.showNotification(r.kind === 'video' ? '📹 Incoming video call' : '📞 Incoming voice call', { body: peer.name + ' is calling you', tag: 'call-' + r.id, requireInteraction: true, icon: peer.avatar || '/app/icon-192.png', data: { url: '/app/#call=' + r.id, type: 'call' } })).catch(() => {});
  ov.querySelector('#dec').onclick = async () => { closeIncoming(); await sb.rpc('end_call', { cid: r.id, how: 'declined' }); };
  ov.querySelector('#acc').onclick = () => answerCall(r, peer);
  CALL.inTimer = setTimeout(() => { if (CALL.incoming?.id === r.id) { closeIncoming(); toast('Missed call from ' + peer.name); } }, Math.max(5000, 55000 - (Date.now() - Date.parse(r.created_at))));
}
function closeIncoming() { stopTone(); clearTimeout(CALL.inTimer); CALL.inUI?.remove(); CALL.inUI = null; CALL.incoming = null; }
async function answerCall(r, peer) {
  closeIncoming();
  try { CALL.local = await getMedia(r.kind); } catch { toast(`Allow microphone${r.kind === 'video' ? ' and camera' : ''} access to answer`); await sb.rpc('end_call', { cid: r.id, how: 'declined' }); return; }
  CALL.id = r.id; CALL.kind = r.kind; CALL.role = 'callee'; CALL.conv = r.conversation_id; CALL.connected = false;
  callUI(peer, r.kind, 'Connecting…');
  const pc = (CALL.pc = newPC()); CALL.local.getTracks().forEach((t) => pc.addTrack(t, CALL.local));
  try {
    await pc.setRemoteDescription(r.offer); await pc.setLocalDescription(await pc.createAnswer()); await gatherDone(pc);
    const { error } = await sb.rpc('answer_call', { cid: r.id, sdp: pc.localDescription.toJSON() });
    if (error) { toast(callErr(error.message)); cleanupCall(); }
  } catch (e) { console.warn(e); toast('Could not connect the call'); hangup(); }
}
async function hangup() { const id = CALL.id; cleanupCall(); if (id) await sb.rpc('end_call', { cid: id, how: 'ended' }); }
function cleanupCall() {
  stopTone(); clearTimeout(CALL.noAns); clearInterval(CALL.tick);
  try { CALL.local?.getTracks().forEach((t) => t.stop()); } catch {}
  try { CALL.pc?.close(); } catch {}
  CALL.ui?.remove(); Object.assign(CALL, { pc: null, id: null, role: null, local: null, ui: null, connected: false, tick: null });
}
async function openCallLink(id, decline) {
  const { data: r } = await sb.from('rtc_calls').select('*').eq('id', id).maybeSingle();
  if (!r || r.status !== 'ringing') return toast('This call has ended');
  if (decline) return sb.rpc('end_call', { cid: id, how: 'declined' });
  if (r.callee_id === S.me.id) incomingCall(r);
}
function handleLink(url) {
  const h = new URL(url, location.href).hash; if (!h) return;
  const call = h.match(/call=([0-9a-f-]{36})/), chat = h.match(/chat=([0-9a-f-]{36})/);
  if (call || chat) history.replaceState(null, '', location.pathname);
  if (call) openCallLink(call[1], /decline=1/.test(h));
  else if (chat) { setTab('chats'); openById(chat[1]); }
}

// ---------- Hooks into the app ----------
const _shell = shell;
shell = function () {
  _shell();
  sb.channel('calls:' + S.me.id).on('postgres_changes', { event: '*', schema: 'public', table: 'rtc_calls' }, (p) => onCallRow(p.new)).subscribe();
  enablePush(false); setTimeout(notifBanner, 1500);
  handleLink(location.href);
  // a call that started while the app was closed
  sb.from('rtc_calls').select('*').eq('callee_id', S.me.id).eq('status', 'ringing').gt('created_at', new Date(Date.now() - 50000).toISOString()).order('created_at', { ascending: false }).limit(1)
    .then(({ data }) => { if (data?.[0]) onCallRow(data[0]); });
};
navigator.serviceWorker?.addEventListener('message', (e) => { if (e.data?.mitroOpen) handleLink(e.data.mitroOpen); });
window.addEventListener('hashchange', () => { if (S.me) handleLink(location.href); });

const _setTab = setTab;
setTab = function (t) { _setTab(t); if (t === 'chats') setTimeout(notifBanner, 50); };

const _openChat = openChat;
openChat = async function (c) {
  const p = _openChat(c);
  if (isDM(c)) {
    const sr = root.querySelector('#main #sr');
    if (sr && !root.querySelector('#cvoice')) {
      sr.insertAdjacentHTML('beforebegin', '<button class="ic" id="cvoice" title="Voice call">📞</button><button class="ic" id="cvideo" title="Video call">📹</button>');
      root.querySelector('#cvoice').onclick = () => startCall('voice');
      root.querySelector('#cvideo').onclick = () => startCall('video');
    }
  }
  return p;
};

// ---------- Start ----------
sb.auth.onAuthStateChange((_e, session) => {
  const u = session?.user || null; if (u?.id === S.me?.id && root.childElementCount) return;
  S.me = u; S.cur = null; if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  if (S.me) gate().then(deepLink); else signIn();
});
